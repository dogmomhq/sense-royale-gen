  .streak-chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(42,40,26,0.8);
    border:2.5px solid var(--lime);border-radius:22px;padding:14px 0 4px;width:180px;height:114px;justify-content:center}
  .chip-top{display:flex;align-items:center;gap:16px}
  .streak-num{font-family:'Anton',sans-serif;color:var(--lime);font-size:66px;line-height:1}
  .flame{width:64px;height:60px}
  .streak-label{font-size:32px;font-weight:700;letter-spacing:0.08em}
  .balance{display:flex;align-items:center;justify-content:space-between;background:rgba(42,40,26,0.8);
    border:2.5px solid var(--lime);border-radius:22px;padding:0 37px 0 38px;width:343px;height:114px}
  .balance-text{line-height:1}
  .balance-text .lbl{font-size:22px;font-weight:700;letter-spacing:0.12em;color:var(--cream-dim);margin-bottom:8px}
  .balance-text .val{font-size:48px;font-weight:900;letter-spacing:-0.02em}
  .plus-btn{width:54px;height:54px;border-radius:50%;background:transparent;border:3px solid var(--lime);
    display:flex;align-items:center;justify-content:center;color:var(--lime);font-size:38px;font-weight:700;flex-shrink:0}

  /* stake pill */
  .stake{position:absolute;top:292px;left:0;right:0;display:flex;justify-content:center;z-index:15}
  .stake span{background:rgba(20,24,16,0.78);border:1.5px solid rgba(215,248,74,0.5);border-radius:40px;
    padding:14px 44px;color:var(--lime);font-weight:800;font-size:34px;letter-spacing:0.06em}

  /* ── TIMER RING — pure overlay, never behind the photo ── */
  .ring-wrap{position:absolute;top:430px;left:50%;transform:translateX(-50%);width:840px;height:840px;z-index:15}
  svg.ring{width:100%;height:100%;overflow:visible}
  /* the sparkler sprite: HTML layer so screen-blend composites against the photo */
  .spark{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:screen;will-change:transform,opacity}
  .spark-flicker{width:560px;height:560px;visibility:hidden}
  .spark-flicker img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden;pointer-events:none}
  .spark-glow{width:480px;height:480px;border-radius:50%;filter:blur(8px);visibility:hidden;
    background:radial-gradient(circle, rgba(255,250,230,0.95) 0%, rgba(255,220,80,0.7) 24%, rgba(255,130,40,0.4) 50%, rgba(255,130,40,0) 72%)}
  .sparks-pool{position:absolute;inset:0;pointer-events:none}
  .sdot{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;display:none;
    background:radial-gradient(circle, #FFFFFF 0%, #FFDC50 45%, rgba(255,130,40,0) 100%);
    mix-blend-mode:screen;will-change:transform,opacity}
  .t-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:78px;fill:var(--lime)}
  .t-num-center{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:64px;fill:var(--lime);
    opacity:0.95}

function arcPath(a0, a1) { // angles in degrees from 12 o'clock, clockwise
  let span = a1 - a0;
  if (span < 0.05) span = 0.05;          // zero-length arcs render as nothing
  if (span > 359.9) span = 359.9;        // 360° arcs degenerate (start == end)
  a1 = a0 + span;
  const p = a => [CX + R * Math.sin(a * Math.PI / 180), CY - R * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  const large = span > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`;
}
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

const TAIL_SEGS = 28;

function buildRing(svg, style) {       // create every node ONCE; updates touch attributes only
  svg.innerHTML = '';
  const defs = el('defs', {});
  try {
    defs.innerHTML = `
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="22" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>`;
  } catch (e) { /* no filters -> crisp ring, still fully visible */ }
  svg.appendChild(defs);
  const refs = { style };

  if (style === 'comet') {
    svg.appendChild(el('circle', {cx:CX, cy:CY, r:R, fill:'none', stroke:'rgba(212,242,60,0.22)', 'stroke-width':14}));
    refs.tail = [];
    for (const [width, blur, op] of [[30,'url(#glowBig)',0.5],[24,'url(#glow)',0.5],[20,null,0.95]]) {
      const segs = [];
      for (let i = 0; i < TAIL_SEGS; i++) {
        const attrs = {fill:'none', stroke:'#D4F23C', 'stroke-width': width - i * 0.5,
          'stroke-linecap':'round', opacity: (1 - i / TAIL_SEGS) * op};
        if (blur) attrs.filter = blur;
        segs.push(svg.appendChild(el('path', attrs)));
      }
      refs.tail.push(segs);
    }
    refs.headGlow = svg.appendChild(el('circle', {r:46, fill:'rgba(215,248,74,0.35)', filter:'url(#glowBig)'}));
    refs.headCore = svg.appendChild(el('circle', {r:22, fill:'#F2FFB0', filter:'url(#glow)'}));
    refs.badge = svg.appendChild(el('rect', {width:184, height:104, rx:52,
      fill:'rgba(11,15,10,0.72)', stroke:'rgba(215,248,74,0.5)', 'stroke-width':2}));
    refs.num = svg.appendChild(el('text', {'text-anchor':'middle', 'dominant-baseline':'middle', class:'t-num'}));
  }

  if (style === 'fuse') {
    // burnt trail (elapsed arc): smooth pale spent-fuse ring
    refs.burnt = [
      svg.appendChild(el('path', {fill:'none', stroke:'rgba(225,228,218,0.18)', 'stroke-width':22, 'stroke-linecap':'round', filter:'url(#glow)'})),
      svg.appendChild(el('path', {fill:'none', stroke:'rgba(225,228,218,0.40)', 'stroke-width':12, 'stroke-linecap':'round'})),
    ];
    // LASER remaining arc: thin, intense, hot-core beam
    refs.rem = [
      svg.appendChild(el('path', {fill:'none', stroke:'#D4F23C', 'stroke-width':30, 'stroke-linecap':'round', opacity:0.35, filter:'url(#glowBig)'})),
      svg.appendChild(el('path', {fill:'none', stroke:'#D4F23C', 'stroke-width':14, 'stroke-linecap':'round', opacity:0.95, filter:'url(#glow)'})),
      svg.appendChild(el('path', {fill:'none', stroke:'#F4FFC8', 'stroke-width':5, 'stroke-linecap':'round'})),  // white-hot core
    ];
    refs.headGlow = svg.appendChild(el('circle', {r:26, fill:'rgba(255,190,80,0.55)', filter:'url(#glow)'}));
    refs.headCore = svg.appendChild(el('circle', {r:13, fill:'#FFFFFF'}));
    // CENTERED number — small, quiet, always readable
    svg.appendChild(el('circle', {cx:CX, cy:CY, r:86, fill:'rgba(11,15,10,0.55)'}));
    refs.num = svg.appendChild(el('text', {x:CX, y:CY+6, 'text-anchor':'middle', 'dominant-baseline':'middle', class:'t-num-center'}));
  }
  return refs;
}

function updateRing(refs, tLeft) {
  const elapsed = (10 - tLeft) / 10;             // 0..1
  const headA = elapsed * 360;                   // head angle from top, clockwise
  const ha = headA * Math.PI / 180;
  const hx = CX + R * Math.sin(ha), hy = CY - R * Math.cos(ha);

  if (refs.style === 'comet') {
    const TAIL = Math.min(130, Math.max(headA, 0.1));
    for (const segs of refs.tail)
      for (let i = 0; i < TAIL_SEGS; i++) {
        const a1 = headA - (TAIL / TAIL_SEGS) * i, a0 = headA - (TAIL / TAIL_SEGS) * (i + 1);
        segs[i].setAttribute('d', arcPath(a0, a1));
      }
    refs.headGlow.setAttribute('cx', hx); refs.headGlow.setAttribute('cy', hy);
    refs.headCore.setAttribute('cx', hx); refs.headCore.setAttribute('cy', hy);
    const nx = CX + (R + 92) * Math.sin(ha), ny = CY - (R + 92) * Math.cos(ha);
    refs.badge.setAttribute('x', nx - 92); refs.badge.setAttribute('y', ny - 52);
    refs.num.setAttribute('x', nx); refs.num.setAttribute('y', ny + 6);
    refs.num.textContent = tLeft.toFixed(1);
  }

  if (refs.style === 'fuse') {
    const showBurnt = headA > 0.5 ? '' : 'none';
    for (const p of refs.burnt) { p.style.display = showBurnt; if (headA > 0.5) p.setAttribute('d', arcPath(0, headA)); }
    const showRem = headA < 359.5 ? '' : 'none';
    for (const p of refs.rem) { p.style.display = showRem; if (headA < 359.5) p.setAttribute('d', arcPath(headA, 360)); }
    refs.headGlow.setAttribute('cx', hx); refs.headGlow.setAttribute('cy', hy);
    refs.headCore.setAttribute('cx', hx); refs.headCore.setAttribute('cy', hy);
    refs.num.textContent = tLeft.toFixed(1);
    refs.sparkPos = {x: hx, y: hy};
  }
}

// build screens — each screen builds independently; one failure can't take down the other
const styles = WHICH === 'both' ? ['comet', 'fuse'] : [WHICH];
const stage = document.querySelector('.stage');
const tpl = document.getElementById('screen-tpl');
const POOL_MAX = 24, GRAV = 380;
const screens = styles.map(s => {
  try {
    const node = tpl.content.cloneNode(true);
    const scr = node.querySelector('.screen');
    node.querySelector('.label').textContent = s.toUpperCase() + ' RING';
    stage.appendChild(node);
    const poolWrap = scr.querySelector('.sparks-pool'), pool = [];
    for (let i = 0; i < POOL_MAX; i++) { const d = document.createElement('div'); d.className = 'sdot'; poolWrap.appendChild(d); pool.push(d); }
    const flicker = scr.querySelector('.spark-flicker');
    // preload all 4 sprite frames into stacked <img>s; a missing frame is just skipped
    const frames = SPARK_FRAMES.map(src => {
      const im = document.createElement('img');
      im.onerror = () => { im.dataset.bad = '1'; im.style.visibility = 'hidden'; };
      im.src = src; flicker.appendChild(im); return im;
    });
    const svg = scr.querySelector('svg.ring');
    return {style: s, svg, refs: buildRing(svg, s),
            glow: scr.querySelector('.spark-glow'), flicker, frames, pool, errs: 0, dead: false};
  } catch (err) { console.error('screen build failed (' + s + '):', err); return null; }
}).filter(Boolean);

/* ───────── LIVE FUSE HEAD: seeded flicker loop + glow pulse + ejected sparks ─────────
   Everything is a pure function of animation time T (seconds) + SEED, so freeze
   renders (?t=N&seed=K) are fully deterministic. */
function hrand(k, salt) {            // stateless hash rng in [0,1)
  let x = (SEED ^ Math.imul(k + 1, 2654435761) ^ Math.imul(salt + 1, 1597334677)) >>> 0;
  x = Math.imul(x ^ (x >>> 15), 2246822519); x = Math.imul(x ^ (x >>> 13), 3266489917);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function frameAt(k) {                // 4-frame cycle @11fps, random order, no immediate repeats
  const raw = t => Math.floor(hrand(t, 1) * 4);
  let f = raw(k);
  if (f === raw(k - 1)) f = (f + 1 + Math.floor(hrand(k, 2) * 3)) % 4;
  return f;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SPARK_PERIOD = 31.5;           // 3 ring cycles; spark schedule loops on this so it never runs dry
const EVENTS = (() => {              // precomputed deterministic spawn schedule
  const rnd = mulberry32(SEED * 9176 + 13), ev = []; let t = 0;
  while (t < SPARK_PERIOD + 1) {
    t += 0.06 + rnd() * 0.09;                          // every 60–150ms
    const n = 1 + Math.floor(rnd() * 3);               // spawn 1–3 sparks
    for (let i = 0; i < n; i++)
      ev.push({ birth: t, life: 0.3 + rnd() * 0.4,     // 300–700ms life
                spread: (rnd() - 0.5) * 2.4,            // ±~69° around backward
                speed: 90 + rnd() * 200, size: 0.5 + rnd() * 0.7 });
  }
  return ev;
})();
function headPosAt(T) {              // head xy + travel angle at animation time T
  const tLeft = Math.max(0, Math.min(10, 10 - T % 10.5));
  const a = ((10 - tLeft) / 10) * 2 * Math.PI;
  return { x: CX + R * Math.sin(a), y: CY - R * Math.cos(a), a };
}
function updateFuseFx(s, T) {
  const p = s.refs.sparkPos;
  if (!p || s.style !== 'fuse') {
    s.glow.style.visibility = s.flicker.style.visibility = 'hidden';
    s.pool.forEach(d => d.style.display = 'none'); return;
  }
  s.glow.style.visibility = s.flicker.style.visibility = 'visible';
  // flicker loop: frame swap + scale 0.92–1.08 + rotation ±20° per tick
  const k = Math.floor(T * 11);
  let f = frameAt(k);
  if (s.frames[f].dataset.bad) f = s.frames.findIndex(im => !im.dataset.bad);  // fall back to any loaded frame
  for (let i = 0; i < s.frames.length; i++)
    s.frames[i].style.visibility = (i === f && !s.frames[i].dataset.bad) ? 'visible' : 'hidden';
  const sc = 0.92 + hrand(k, 3) * 0.16, rot = (hrand(k, 4) - 0.5) * 40;
  s.flicker.style.transform = `translate(${p.x - 280}px, ${p.y - 280}px) rotate(${rot}deg) scale(${sc})`;
  // soft glow beneath, pulsing ~14Hz between 0.5 and 0.9 (also the no-sprite fallback)
  s.glow.style.opacity = (0.5 + hrand(Math.floor(T * 14), 5) * 0.4).toFixed(3);
  s.glow.style.transform = `translate(${p.x - 240}px, ${p.y - 240}px)`;
  // ejected sparks: fly backward along travel + downward gravity, fade + shrink
  const TT = T % SPARK_PERIOD;       // schedule loops; head phase matches (31.5 = 3 × 10.5)
  const alive = [];
  for (const e of EVENTS) if (e.birth <= TT && TT < e.birth + e.life) alive.push(e);
  const live = alive.slice(-POOL_MAX);
  for (let i = 0; i < POOL_MAX; i++) {
    const d = s.pool[i], e = live[i];
    if (!e) { d.style.display = 'none'; continue; }
    const hp = headPosAt(e.birth), age = TT - e.birth, ang = hp.a + Math.PI + e.spread;
    const x = hp.x + Math.cos(ang) * e.speed * age;
    const y = hp.y + Math.sin(ang) * e.speed * age + 0.5 * GRAV * age * age;
    const kk = 1 - age / e.life;                       // 1 → 0 over life
    d.style.display = 'block';
    d.style.opacity = kk.toFixed(3);
    d.style.transform = `translate(${x - 7}px, ${y - 7}px) scale(${(e.size * (0.4 + 0.6 * kk)).toFixed(3)})`;
  }
}

function safeUpdate(s, tLeft, T) {   // a failing layer disables itself, never the loop
  if (s.dead) return;
  try { updateRing(s.refs, tLeft); updateFuseFx(s, T); s.errs = 0; }
  catch (err) {
    if (++s.errs === 1) console.error('ring update failed (' + s.style + '):', err);
    if (s.errs > 120) s.dead = true;   // ~2s of solid failures: freeze this screen, keep the rest
  }
}
function degradeFilters() {          // drop blur filters if the browser can't keep up
  for (const s of screens) {
    try { s.svg.querySelectorAll('[filter]').forEach(n => n.removeAttribute('filter')); } catch (e) {}
  }
}

if (FREEZE !== null) {
  const T = 10 - FREEZE;             // deterministic phase for stills
  screens.forEach(s => safeUpdate(s, FREEZE, T));
} else {
  // paint a correct first frame immediately — never a blank ring while waiting on rAF/images
  screens.forEach(s => safeUpdate(s, 10, 0));
  let start = null, prev = null, frames = 0, slow = 0, degraded = false;
  function tick(now) {
    if (start === null) start = prev = now;
    const T = (now - start) / 1000;
    let tLeft = 10 - T % 10.5;       // brief hold at 0
    tLeft = Math.max(0, Math.min(10, tLeft));
    screens.forEach(s => safeUpdate(s, tLeft, T));
    if (!degraded) {
      frames++; if (now - prev > 140) slow++;
      if (frames >= 30 && slow / frames > 0.5) { degraded = true; degradeFilters(); }
    }
    prev = now;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
