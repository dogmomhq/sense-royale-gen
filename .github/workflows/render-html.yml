name: render-html
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
      viewport_w:
        required: true
        default: '1024'
      viewport_h:
        required: true
        default: '2224'
      html_path:
        required: true
        description: 'repo-relative path to the HTML file (e.g. sense_proto/render_v25.html)'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install chromium --with-deps
      - name: render
        env:
          TAG: ${{ inputs.tag }}
          VW: ${{ inputs.viewport_w }}
          VH: ${{ inputs.viewport_h }}
          HTML_PATH: ${{ inputs.html_path }}
        run: |
          mkdir -p out
          test -f "$HTML_PATH" || { echo "HTML not found at $HTML_PATH"; exit 1; }
          node -e "
            const { chromium } = require('playwright');
            const path = require('path');
            (async () => {
              const b = await chromium.launch();
              const ctx = await b.newContext({ viewport: { width: parseInt(process.env.VW), height: parseInt(process.env.VH) }, deviceScaleFactor: 1 });
              const page = await ctx.newPage();
              const fileUrl = 'file://' + path.resolve(process.env.HTML_PATH);
              await page.goto(fileUrl, { waitUntil: 'networkidle', timeout: 20000 });
              await page.waitForTimeout(3000);
              await page.screenshot({ path: 'out/' + process.env.TAG + '.png', clip: { x:0, y:0, width: parseInt(process.env.VW), height: parseInt(process.env.VH) } });
              await b.close();
              console.log('rendered ' + process.env.TAG + '.png');
            })();
          "
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.tag }}
          path: out/*.png
          retention-days: 7
