name: render-html
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
      viewport_w:
        required: true
        default: '1024'
      viewport_h:
        required: true
        default: '2224'
      html_b64:
        required: true
        description: 'base64 of the HTML to render'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --silent
          npx playwright install chromium --with-deps
      - name: render
        env:
          HTML_B64: ${{ inputs.html_b64 }}
          TAG: ${{ inputs.tag }}
          VW: ${{ inputs.viewport_w }}
          VH: ${{ inputs.viewport_h }}
        run: |
          mkdir -p out
          echo "$HTML_B64" | base64 -d > out/input.html
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch();
              const ctx = await b.newContext({ viewport: { width: parseInt(process.env.VW), height: parseInt(process.env.VH) }, deviceScaleFactor: 1 });
              const page = await ctx.newPage();
              await page.goto('file://' + require('path').resolve('out/input.html'), { waitUntil: 'networkidle', timeout: 15000 });
              await page.waitForTimeout(2500);
              await page.screenshot({ path: 'out/' + process.env.TAG + '.png', clip: { x:0, y:0, width: parseInt(process.env.VW), height: parseInt(process.env.VH) } });
              await b.close();
              console.log('rendered ' + process.env.TAG + '.png');
            })();
          "
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.tag }}
          path: out/*.png
          retention-days: 7
